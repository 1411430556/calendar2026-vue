<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：允许页面延伸进刘海/圆角区域，由 CSS env(safe-area-inset-*) 避让 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="2026年完整日历，标注国务院办公厅法定节假日放假调休安排、补班日、农历、二十四节气与传统节日。数据依据国办发明电〔2025〕7号。"
    />
    <title>2026 丙午马年 · 全年节假日日历（含农历·节气·调休）</title>
    <!-- 主题色与 --paper 一致：移动端浏览器地址栏/状态栏跟随纸色 -->
    <meta name="theme-color" content="#f3ede0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- iOS 不支持 SVG 图标，主屏图标使用 PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <!-- 数据接口域名预解析：移动网络下省掉首次请求时的 DNS 查询时间 -->
    <link rel="dns-prefetch" href="https://api.shwgij.com" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
